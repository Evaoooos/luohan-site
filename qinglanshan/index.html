<header><div class="mark">青岚山</div><h1>青岚山养徒札记</h1><p class="sub">你是一座小山门的掌门，要活十世。每一世收徒、教徒、送他们出师；山上的人各有各的心事，都记在这本札记里。</p></header>
<p>山上的日子自己往前走。谁和谁交好，谁暗暗动了心，谁结了仇，谁下山再没回来，一条一条写进札记。你能做的不多：教一回徒弟，讲一回道，替有心的人说几句好话。剩下的，看他们自己。</p>
<p>单机，不用注册，不联网。</p>
